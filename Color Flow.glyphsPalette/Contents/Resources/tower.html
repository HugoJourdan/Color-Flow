<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Color Flow — master color tower (draft)</title>
<!--
  Standalone prototype of the "Color Tower" visualizer: one disc per master,
  stacked isometrically, each disc a blurred blend of that master's label-colour
  distribution. Self-contained (no network, no deps) so it mirrors the report's
  constraints. Open directly in a browser. The data model below mirrors the real
  colorflow_dashboard model (COLORS = --c0..--c11; each master: counts[] + uncolored)
  so this maps straight onto production. See the implementation plan in
  docs/superpowers/plans/ for wiring this in as a real "Tower" view.
-->
<style>
  html,body{margin:0;height:100%;background:#000;color:#bbb;
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"JetBrains Mono",monospace;
    display:grid;place-items:center}
  .wrap{text-align:center}
  canvas{cursor:grab}
  canvas:active{cursor:grabbing}
  .hint{margin-top:10px;color:#777}
  .row{margin-top:8px;display:flex;gap:14px;justify-content:center;align-items:center;color:#999}
  label{display:inline-flex;gap:6px;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="900" height="780"></canvas>
  <div class="row">
    <label>master <select id="master"></select></label>
    <label>tilt <input id="tilt" type="range" min="20" max="70" value="50"> <span id="tiltval">50</span></label>
    <label>slices/gap <input id="slices" type="range" min="1" max="20" value="1"></label>
    <label><input id="spin" type="checkbox" checked> auto-spin</label>
    <label><input id="hole" type="checkbox" checked> uncolored hole</label>
  </div>
  <div class="row">
    <label>trim <input id="trim" type="range" min="0" max="100" value="50"> <span id="trimval">50</span></label>
    <label>opacity <input id="opacity" type="range" min="0" max="100" value="20"> <span id="opacityval">20</span></label>
  </div>
  <div class="hint">drag to rotate · one disc per master · colour = that master's label-colour mix, blurred like the favicon</div>
</div>
<script>
// ---------------------------------------------------------------------------
// Model. In Glyphs the plugin injects `window.TOWER_MODEL` (real per-master
// label-colour counts + uncolored tally, built by colorflow_tower.py). Opened
// directly in a browser there is no injection, so we fall back to this SAMPLE
// model and the file runs standalone. Each master: per-label `counts` array
// (12 slots) + an `uncolored` tally; `total` = glyphs per master (hole sizing).
// ---------------------------------------------------------------------------
const SAMPLE_MODEL = {
  total: 60,
  masters: [
    {name:"Thin",    counts:[2,1,0,3,1,0,1,0,0,0,5,2], uncolored:45},
    {name:"Light",   counts:[5,3,1,6,3,2,3,1,1,1,3,1], uncolored:30},
    {name:"Regular", counts:[8,6,2,9,6,4,6,3,3,2,2,1], uncolored:8},
    {name:"Bold",    counts:[12,9,4,12,9,7,10,6,5,4,1,0], uncolored:3},
    {name:"Black",   counts:[16,12,6,15,12,10,13,9,8,6,0,0], uncolored:0},
  ],
};
const MODEL = (typeof window !== "undefined" && window.TOWER_MODEL) ? window.TOWER_MODEL : SAMPLE_MODEL;
const TOTAL = MODEL.total || 1;     // glyphs per master (for hole sizing)
const MASTERS = MODEL.masters || [];

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;

// Vivid full-spectrum hue per label slot — the SAME palette as the favicon and
// the button GIF (a full HSL rainbow wheel), not the muted Glyphs label hexes.
function hueHsl(i){ return `hsl(${Math.round((i/12)*360)},100%,55%)`; }

// Build one master's blurred colour disc on an offscreen canvas. Each label
// colour is a soft radial blob placed at its position on the colour wheel,
// sized by its share of the master; a final blur pass gives the favicon look.
const FS = 320;
// Build one master's disc: PROPORTIONAL pie wedges — each label-colour occupies
// an arc sized by its share of THIS master's coloured glyphs — then blurred for
// the favicon look. So the disc literally shows the master's colour repartition:
// a red/yellow-heavy master reads red/yellow, an even spread stays rainbow, and
// the discs differ from one master to the next. Uncolored glyphs are represented
// by the central hole, not here.
function buildField(counts){
  const off = document.createElement("canvas"); off.width = off.height = FS;
  const g = off.getContext("2d");
  const cx = FS/2, cy = FS/2, R = FS*0.46;
  const sum = counts.reduce((a,b)=>a+b,0);
  if (!sum){
    g.fillStyle = "hsl(0,0%,82%)"; g.fillRect(0,0,FS,FS);
  } else {
    // proportional conic gradient: place each present colour's stop at the
    // MIDDLE of its arc (arc width = its share of the master) so neighbouring
    // colours interpolate smoothly across the boundaries — no hard seams.
    const stops = [];
    let acc = 0;
    counts.forEach((cnt,i)=>{
      if (!cnt) return;
      stops.push([acc + (cnt/sum)/2, i]);
      acc += cnt/sum;
    });
    let filled = false;
    try {
      const base = g.createConicGradient(-Math.PI/2, cx, cy);
      stops.forEach(([off,i])=> base.addColorStop(off, hueHsl(i)));
      base.addColorStop(1, hueHsl(stops[0][1]));   // wrap last->first across 12 o'clock
      g.fillStyle = base; g.fillRect(0,0,FS,FS); filled = true;
    } catch (e) { filled = false; }
    if (!filled){                                  // hard-wedge fallback
      let a = -Math.PI/2;
      counts.forEach((cnt,i)=>{
        if (!cnt) return;
        const a1 = a + (cnt/sum)*Math.PI*2;
        g.fillStyle = hueHsl(i);
        g.beginPath(); g.moveTo(cx,cy); g.arc(cx,cy,R*1.25,a,a1); g.closePath(); g.fill();
        a = a1;
      });
    }
  }
  // darken toward the centre for depth around the bore
  const dk = g.createRadialGradient(cx,cy,0, cx,cy,R*0.72);
  dk.addColorStop(0, "rgba(0,0,0,0.58)");
  dk.addColorStop(0.5, "rgba(0,0,0,0.26)");
  dk.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = dk; g.beginPath(); g.arc(cx,cy,R*0.72,0,7); g.fill();
  const blurred = document.createElement("canvas"); blurred.width = blurred.height = FS;
  const bg = blurred.getContext("2d");
  // the conic blend is already smooth; this blur melts the centre convergence
  // and the wrap seam into a soft favicon-like wheel
  bg.filter = "blur(13px) saturate(1.3) brightness(1.05)";
  bg.drawImage(off,0,0);
  return blurred;
}
const FIELDS = MASTERS.map(m=>buildField(m.counts));
const HOLE = MASTERS.map(m=>m.uncolored/TOTAL);

// Icy frost speckle, built once and reused on every disc (no per-frame flicker).
const FROST = (function(){
  const c = document.createElement("canvas"); c.width = c.height = FS;
  const g = c.getContext("2d");
  for (let k=0;k<1600;k++){
    const x = Math.random()*FS, y = Math.random()*FS, r = Math.random()*1.6 + 0.3;
    g.fillStyle = `rgba(255,255,255,${Math.random()*0.07})`;
    g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  const out = document.createElement("canvas"); out.width = out.height = FS;
  const og = out.getContext("2d");
  og.filter = "blur(0.6px)"; og.drawImage(c,0,0);
  return out;
})();

// offscreen buffer so a whole disc can be composited at a single opacity
const buf = document.createElement("canvas"); buf.width = W; buf.height = H;
const bctx = buf.getContext("2d");

// paint one disc into target context g at full opacity (drawDisc handles fading)
function paintDisc(g, fieldA, fieldB, t, cx, cy, rx, ry, rot, holeFrac){
  const o = rx*1.14;            // overscan so the field's blurred rim is clipped away
  // 1) colour field — rotates with the spin
  g.save();
  g.translate(cx,cy); g.scale(1, ry/rx); g.rotate(rot);
  g.beginPath(); g.arc(0,0,rx,0,7); g.clip();
  g.globalAlpha = DISC_ALPHA;            g.drawImage(fieldA,-o,-o,o*2,o*2);
  if (fieldB && t>0){ g.globalAlpha = DISC_ALPHA*t; g.drawImage(fieldB,-o,-o,o*2,o*2); }
  g.globalAlpha = 1;
  g.restore();
  // 2) frosted-glass treatment — fixed light (NOT rotated): milky veil + top
  //    specular sheen, then punch the hole through everything
  g.save();
  g.translate(cx,cy); g.scale(1, ry/rx);
  g.beginPath(); g.arc(0,0,rx,0,7); g.clip();
  g.fillStyle = "rgba(255,255,255,0.10)";                 // milky frost veil
  g.beginPath(); g.arc(0,0,rx,0,7); g.fill();
  g.globalAlpha = 0.9;                                    // icy frost speckle
  g.drawImage(FROST, -rx,-rx, rx*2, rx*2);
  g.globalAlpha = 1;
  // directional light, brighter toward the BACK (top) edge — restored but at
  // HALF the former intensity, so the back is only gently lighter than the front
  const sheen = g.createLinearGradient(0,-rx,0,rx);
  sheen.addColorStop(0,    "rgba(255,255,255,0.25)");      // back edge
  sheen.addColorStop(0.34, "rgba(255,255,255,0.025)");
  sheen.addColorStop(0.66, "rgba(255,255,255,0.025)");
  sheen.addColorStop(1,    "rgba(255,255,255,0.16)");      // front edge
  g.fillStyle = sheen; g.beginPath(); g.arc(0,0,rx,0,7); g.fill();
  const hot = g.createRadialGradient(0,-rx*0.4,0, 0,-rx*0.4, rx*0.8);
  hot.addColorStop(0, "rgba(255,255,255,0.13)");           // half-strength back hotspot
  hot.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = hot; g.beginPath(); g.arc(0,0,rx,0,7); g.fill();
  if (holeFrac>0){
    const hr = rx*0.26;   // constant: same hole size on every disc
    g.globalCompositeOperation = "destination-out";
    const pg = g.createRadialGradient(0,0,0,0,0,hr);
    pg.addColorStop(0,"rgba(0,0,0,1)");
    pg.addColorStop(0.94,"rgba(0,0,0,1)");
    pg.addColorStop(1,"rgba(0,0,0,0)");      // thin anti-alias edge — no border
    g.fillStyle = pg; g.beginPath(); g.arc(0,0,hr,0,7); g.fill();
    g.globalCompositeOperation = "source-over";
  }
  g.restore();
  // 3) glassy rim — brighter at the BACK (top), darker at the front (bottom),
  //    at half the former light intensity
  g.save();
  g.translate(cx,cy); g.scale(1, ry/rx);
  const rim = g.createLinearGradient(0,-rx,0,rx);
  rim.addColorStop(0, "rgba(255,255,255,0.375)");
  rim.addColorStop(0.5, "rgba(255,255,255,0.05)");
  rim.addColorStop(1, "rgba(0,0,0,0.18)");
  g.strokeStyle = rim; g.lineWidth = 2;
  g.beginPath(); g.arc(0,0,rx*0.992,0,7); g.stroke();
  g.restore();
}

// draw a disc to the main canvas at the given opacity (1 = full). For opacity<1
// the disc is rendered once into the offscreen buffer then composited, so it
// fades uniformly (true translucency) instead of being veiled toward the bg.
function drawDisc(fieldA, fieldB, t, cx, cy, rx, ry, rot, holeFrac, opacity, trim){
  if (opacity>=1 && trim<=0){
    paintDisc(ctx, fieldA, fieldB, t, cx, cy, rx, ry, rot, holeFrac);
    return;
  }
  bctx.clearRect(0,0,W,H);
  paintDisc(bctx, fieldA, fieldB, t, cx, cy, rx, ry, rot, holeFrac);
  if (trim>0){
    // darken only the disc's own pixels (source-atop) — the hole and the area
    // outside the disc stay untouched
    bctx.save();
    bctx.translate(cx,cy); bctx.scale(1, ry/rx);
    bctx.globalCompositeOperation = "source-atop";
    bctx.fillStyle = "rgba(0,0,0,"+trim+")";
    bctx.beginPath(); bctx.arc(0,0,rx,0,7); bctx.fill();
    bctx.restore();
  }
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.drawImage(buf, 0, 0);
  ctx.restore();
}

let rot = -0.5, dragging = false, lastX = 0, autospin = true;
let tilt = 0.50, perGap = 1, holeOn = true, selected = -1;   // selected = -1 -> show all masters
const DISC_ALPHA = 0.95;                       // discs a touch translucent
let discHits = [], hitCx = 0, hitRx = 0, hitRy = 0;   // disc hit-test geometry, set each render
let downX = 0, downY = 0;                             // pointer-down point for click-vs-drag
let trimVal = 0.5, opacityVal = 0.2;                  // non-selected discs: darken + fade

function render(){
  ctx.clearRect(0,0,W,H);
  const M = MASTERS.length;
  if (!M) return;                       // nothing to draw (no masters)
  const rx = 185, ry = rx*tilt;
  const N = (M-1)*perGap + 1;
  const dz = 52;                        // FIXED gap between discs
  const towerH = N>1 ? (N-1)*dz : 0;    // tower grows taller with more discs (gap stays)
  const cx = W/2, topY = (H-towerH)/2 + 20;
  hitCx = cx; hitRx = rx; hitRy = ry; discHits = [];   // capture geometry for click hit-test

  // soft ground shadow
  ctx.save();
  ctx.translate(cx, topY+towerH+ry*0.6); ctx.scale(1,tilt);
  const sg = ctx.createRadialGradient(0,0,0,0,0,rx);
  sg.addColorStop(0,"rgba(0,0,0,.10)"); sg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(0,0,rx*1.05,0,7); ctx.fill();
  ctx.restore();

  // draw bottom -> top so the TOP disc paints last and sits above the others.
  // A selected master keeps its natural stack position — the disc above still
  // overlaps it a bit; only the non-selected discs are trimmed (faded back).
  for (let n=N-1; n>=0; n--){
    const cy = topY + n*dz;
    const p = (M-1) - n/perGap;          // last master on top, first at the base
    const lo = Math.max(0, Math.floor(p));
    const t = p - lo;
    const fA = FIELDS[lo], fB = FIELDS[Math.min(M-1, lo+1)];
    discHits.push({cy: cy, master: Math.round(p)});   // record for click hit-test (top last)
    // subtle drop shadow under each disc, just a bit
    ctx.save();
    ctx.translate(cx, cy + ry*0.5); ctx.scale(1, ry/rx);
    const sh = ctx.createRadialGradient(0,0,0,0,0,rx);
    sh.addColorStop(0, "rgba(0,0,0,0.07)");
    sh.addColorStop(0.7, "rgba(0,0,0,0.03)");
    sh.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = sh; ctx.beginPath(); ctx.arc(0,0,rx,0,7); ctx.fill();
    ctx.restore();
    const other = (selected>=0 && Math.round(p)!==selected);
    drawDisc(fA, fB, t, cx, cy, rx, ry, rot, holeOn ? 1 : 0,
             other ? opacityVal : 1, other ? trimVal : 0);
  }
}

function loop(){
  if (autospin && !dragging) rot += 0.004;
  render();
  requestAnimationFrame(loop);
}

// which master's disc is under a canvas-space point — top-most disc wins
// (discHits is pushed bottom-to-top, so the last match drawn on top is found first)
function hitTest(px, py){
  for (let i=discHits.length-1; i>=0; i--){
    const d = discHits[i];
    const ex = (px-hitCx)/hitRx, ey = (py-d.cy)/hitRy;
    if (ex*ex + ey*ey <= 1) return d.master;
  }
  return -1;
}
cv.addEventListener("pointerdown", e=>{ dragging=true; lastX=e.clientX; downX=e.clientX; downY=e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e=>{ if(dragging){ rot += (e.clientX-lastX)*0.01; lastX=e.clientX; }});
cv.addEventListener("pointerup", e=>{
  dragging=false;
  if (Math.hypot(e.clientX-downX, e.clientY-downY) < 5){   // treat as a click, not a drag
    const rect = cv.getBoundingClientRect();
    const px = (e.clientX-rect.left) * (cv.width/rect.width);
    const py = (e.clientY-rect.top) * (cv.height/rect.height);
    const m = hitTest(px, py);
    selected = (m===selected) ? -1 : m;   // click the focused disc (or empty) -> back to All
    document.getElementById("master").value = String(selected);
  }
});
document.getElementById("tilt").addEventListener("input", e=>{ tilt = +e.target.value/100; document.getElementById("tiltval").textContent = e.target.value; });
document.getElementById("slices").addEventListener("input", e=>{ perGap = +e.target.value; });
document.getElementById("spin").addEventListener("change", e=>{ autospin = e.target.checked; });
document.getElementById("hole").addEventListener("change", e=>{ holeOn = e.target.checked; });
document.getElementById("trim").addEventListener("input", e=>{ trimVal = +e.target.value/100; document.getElementById("trimval").textContent = e.target.value; });
document.getElementById("opacity").addEventListener("input", e=>{ opacityVal = +e.target.value/100; document.getElementById("opacityval").textContent = e.target.value; });
(function(){
  const sel = document.getElementById("master");
  const optAll = document.createElement("option"); optAll.value = "-1"; optAll.textContent = "All masters"; sel.appendChild(optAll);
  MASTERS.forEach((m,i)=>{ const o = document.createElement("option"); o.value = String(i); o.textContent = m.name; sel.appendChild(o); });
  sel.addEventListener("change", e=>{ selected = +e.target.value; });
})();
loop();
</script>
</body>
</html>
