<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Color Flow — master color tower (draft)</title>
<!--
  Standalone prototype of the "Color Tower" visualizer: one disc per master,
  stacked isometrically, each disc a blurred blend of that master's label-colour
  distribution. Self-contained (no network, no deps) so it mirrors the report's
  constraints. Open directly in a browser. The data model below mirrors the real
  colorflow_dashboard model (COLORS = --c0..--c11; each master: counts[] + uncolored)
  so this maps straight onto production. See the implementation plan in
  docs/superpowers/plans/ for wiring this in as a real "Tower" view.
-->
<style>
  html,body{margin:0;height:100%;background:#ececec;color:#444;
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"JetBrains Mono",monospace;
    display:grid;place-items:center}
  .wrap{text-align:center}
  canvas{cursor:grab}
  canvas:active{cursor:grabbing}
  .hint{margin-top:10px;color:#999}
  .row{margin-top:8px;display:flex;gap:14px;justify-content:center;align-items:center;color:#777}
  label{display:inline-flex;gap:6px;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="900" height="780"></canvas>
  <div class="row">
    <label>tilt <input id="tilt" type="range" min="20" max="70" value="45"> <span id="tiltval">45</span></label>
    <label>slices/gap <input id="slices" type="range" min="1" max="20" value="1"></label>
    <label><input id="spin" type="checkbox" checked> auto-spin</label>
    <label><input id="hole" type="checkbox" checked> uncolored hole</label>
  </div>
  <div class="hint">drag to rotate · one disc per master · colour = that master's label-colour mix, blurred like the favicon</div>
</div>
<script>
// ---------------------------------------------------------------------------
// Fake model — mirrors the real colorflow_dashboard model shape so this maps
// straight onto production: COLORS = the 12 label hexes (--c0..--c11), and each
// master carries a per-label `counts` array + an `uncolored` tally.
// ---------------------------------------------------------------------------
const COLORS = ["#f97e55","#ffbe68","#ba9d6d","#fff157","#c1ec8a","#6bab59",
                "#64a5ef","#576ef1","#a962e7","#e77eb4","#c5c5c5","#5f5f5f"];
const TOTAL = 60; // glyphs per master (for hole sizing)
const MASTERS = [
  {name:"Thin",    counts:[2,1,0,3,1,0,1,0,0,0,5,2], uncolored:45},
  {name:"Light",   counts:[5,3,1,6,3,2,3,1,1,1,3,1], uncolored:30},
  {name:"Regular", counts:[8,6,2,9,6,4,6,3,3,2,2,1], uncolored:8},
  {name:"Bold",    counts:[12,9,4,12,9,7,10,6,5,4,1,0], uncolored:3},
  {name:"Black",   counts:[16,12,6,15,12,10,13,9,8,6,0,0], uncolored:0},
];

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;

// Vivid full-spectrum hue per label slot — the SAME palette as the favicon and
// the button GIF (a full HSL rainbow wheel), not the muted Glyphs label hexes.
function hueHsl(i){ return `hsl(${Math.round((i/12)*360)},100%,55%)`; }

// Build one master's blurred colour disc on an offscreen canvas. Each label
// colour is a soft radial blob placed at its position on the colour wheel,
// sized by its share of the master; a final blur pass gives the favicon look.
const FS = 320;
// Build one master's disc: PROPORTIONAL pie wedges — each label-colour occupies
// an arc sized by its share of THIS master's coloured glyphs — then blurred for
// the favicon look. So the disc literally shows the master's colour repartition:
// a red/yellow-heavy master reads red/yellow, an even spread stays rainbow, and
// the discs differ from one master to the next. Uncolored glyphs are represented
// by the central hole, not here.
function buildField(counts){
  const off = document.createElement("canvas"); off.width = off.height = FS;
  const g = off.getContext("2d");
  const cx = FS/2, cy = FS/2, R = FS*0.46;
  const sum = counts.reduce((a,b)=>a+b,0);
  if (!sum){
    g.fillStyle = "hsl(0,0%,82%)"; g.fillRect(0,0,FS,FS);
  } else {
    // proportional conic gradient: place each present colour's stop at the
    // MIDDLE of its arc (arc width = its share of the master) so neighbouring
    // colours interpolate smoothly across the boundaries — no hard seams.
    const stops = [];
    let acc = 0;
    counts.forEach((cnt,i)=>{
      if (!cnt) return;
      stops.push([acc + (cnt/sum)/2, i]);
      acc += cnt/sum;
    });
    let filled = false;
    try {
      const base = g.createConicGradient(-Math.PI/2, cx, cy);
      stops.forEach(([off,i])=> base.addColorStop(off, hueHsl(i)));
      base.addColorStop(1, hueHsl(stops[0][1]));   // wrap last->first across 12 o'clock
      g.fillStyle = base; g.fillRect(0,0,FS,FS); filled = true;
    } catch (e) { filled = false; }
    if (!filled){                                  // hard-wedge fallback
      let a = -Math.PI/2;
      counts.forEach((cnt,i)=>{
        if (!cnt) return;
        const a1 = a + (cnt/sum)*Math.PI*2;
        g.fillStyle = hueHsl(i);
        g.beginPath(); g.moveTo(cx,cy); g.arc(cx,cy,R*1.25,a,a1); g.closePath(); g.fill();
        a = a1;
      });
    }
  }
  // darken toward the centre for depth around the bore
  const dk = g.createRadialGradient(cx,cy,0, cx,cy,R*0.72);
  dk.addColorStop(0, "rgba(0,0,0,0.58)");
  dk.addColorStop(0.5, "rgba(0,0,0,0.26)");
  dk.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = dk; g.beginPath(); g.arc(cx,cy,R*0.72,0,7); g.fill();
  const blurred = document.createElement("canvas"); blurred.width = blurred.height = FS;
  const bg = blurred.getContext("2d");
  // the conic blend is already smooth; this blur melts the centre convergence
  // and the wrap seam into a soft favicon-like wheel
  bg.filter = "blur(13px) saturate(1.3) brightness(1.05)";
  bg.drawImage(off,0,0);
  return blurred;
}
const FIELDS = MASTERS.map(m=>buildField(m.counts));
const HOLE = MASTERS.map(m=>m.uncolored/TOTAL);

// Icy frost speckle, built once and reused on every disc (no per-frame flicker).
const FROST = (function(){
  const c = document.createElement("canvas"); c.width = c.height = FS;
  const g = c.getContext("2d");
  for (let k=0;k<1600;k++){
    const x = Math.random()*FS, y = Math.random()*FS, r = Math.random()*1.6 + 0.3;
    g.fillStyle = `rgba(255,255,255,${Math.random()*0.07})`;
    g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  const out = document.createElement("canvas"); out.width = out.height = FS;
  const og = out.getContext("2d");
  og.filter = "blur(0.6px)"; og.drawImage(c,0,0);
  return out;
})();

// crossfade two fields into a tinted disc; returns nothing, draws into ctx
function drawDisc(fieldA, fieldB, t, cx, cy, rx, ry, rot, holeFrac){
  const o = rx*1.14;            // overscan so the field's blurred rim is clipped away
  // 1) colour field — rotates with the spin
  ctx.save();
  ctx.translate(cx,cy); ctx.scale(1, ry/rx); ctx.rotate(rot);
  ctx.beginPath(); ctx.arc(0,0,rx,0,7); ctx.clip();
  ctx.globalAlpha = DISC_ALPHA;            ctx.drawImage(fieldA,-o,-o,o*2,o*2);
  if (fieldB && t>0){ ctx.globalAlpha = DISC_ALPHA*t; ctx.drawImage(fieldB,-o,-o,o*2,o*2); }
  ctx.globalAlpha = 1;
  ctx.restore();
  // 2) frosted-glass treatment — fixed light (NOT rotated): milky veil + top
  //    specular sheen, then punch the hole through everything
  ctx.save();
  ctx.translate(cx,cy); ctx.scale(1, ry/rx);
  ctx.beginPath(); ctx.arc(0,0,rx,0,7); ctx.clip();
  ctx.fillStyle = "rgba(255,255,255,0.10)";                 // milky frost veil
  ctx.beginPath(); ctx.arc(0,0,rx,0,7); ctx.fill();
  ctx.globalAlpha = 0.9;                                    // icy frost speckle
  ctx.drawImage(FROST, -rx,-rx, rx*2, rx*2);
  ctx.globalAlpha = 1;
  // NON-directional gloss: a radially symmetric rim glow so the disc reads the
  // SAME brightness front and back (no top/bottom sheen, no off-centre hotspot)
  const gloss = ctx.createRadialGradient(0,0,rx*0.6, 0,0,rx);
  gloss.addColorStop(0,    "rgba(255,255,255,0)");
  gloss.addColorStop(0.85, "rgba(255,255,255,0.05)");
  gloss.addColorStop(1,    "rgba(255,255,255,0.20)");
  ctx.fillStyle = gloss; ctx.beginPath(); ctx.arc(0,0,rx,0,7); ctx.fill();
  if (holeFrac>0){
    const hr = rx*0.26;   // constant: same hole size on every disc
    ctx.globalCompositeOperation = "destination-out";
    const pg = ctx.createRadialGradient(0,0,0,0,0,hr);
    pg.addColorStop(0,"rgba(0,0,0,1)");
    pg.addColorStop(0.94,"rgba(0,0,0,1)");
    pg.addColorStop(1,"rgba(0,0,0,0)");      // thin anti-alias edge — no border
    ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(0,0,hr,0,7); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  }
  ctx.restore();
  // 3) glassy rim — uniform all the way round (no top-bright/bottom-dark bias)
  //    so the edge looks the same front and back
  ctx.save();
  ctx.translate(cx,cy); ctx.scale(1, ry/rx);
  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0,0,rx*0.992,0,7); ctx.stroke();
  ctx.restore();
}

let rot = -0.5, dragging = false, lastX = 0, autospin = true;
let tilt = 0.45, perGap = 1, holeOn = true;   // mid tilt + one disc per master by default
const DISC_ALPHA = 0.95;                       // discs a touch translucent

function render(){
  ctx.clearRect(0,0,W,H);
  const M = MASTERS.length;
  const rx = 185, ry = rx*tilt;
  const N = (M-1)*perGap + 1;
  const towerH = 210;   // tighter stack -> each disc layer reads thinner
  const dz = towerH/(N-1);
  const cx = W/2, topY = (H-towerH)/2 + 20;

  // soft ground shadow
  ctx.save();
  ctx.translate(cx, topY+towerH+ry*0.6); ctx.scale(1,tilt);
  const sg = ctx.createRadialGradient(0,0,0,0,0,rx);
  sg.addColorStop(0,"rgba(0,0,0,.10)"); sg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(0,0,rx*1.05,0,7); ctx.fill();
  ctx.restore();

  // draw bottom -> top so the TOP disc paints last and sits above the others
  for (let n=N-1; n>=0; n--){
    const cy = topY + n*dz;
    const p = (M-1) - n/perGap;          // last master on top, first at the base
    const lo = Math.max(0, Math.floor(p));
    const t = p - lo;
    const fA = FIELDS[lo], fB = FIELDS[Math.min(M-1, lo+1)];
    // subtle drop shadow under each disc, just a bit
    ctx.save();
    ctx.translate(cx, cy + ry*0.5); ctx.scale(1, ry/rx);
    const sh = ctx.createRadialGradient(0,0,0,0,0,rx);
    sh.addColorStop(0, "rgba(0,0,0,0.07)");
    sh.addColorStop(0.7, "rgba(0,0,0,0.03)");
    sh.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = sh; ctx.beginPath(); ctx.arc(0,0,rx,0,7); ctx.fill();
    ctx.restore();
    drawDisc(fA, fB, t, cx, cy, rx, ry, rot, holeOn ? 1 : 0);   // uniform central bore on every disc
  }
  // master name written ON each disc, centred on its visible front crescent
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "600 12px -apple-system,BlinkMacSystemFont,sans-serif";
  for (let i=0;i<M;i++){
    const n = (M-1-i)*perGap;            // master i sits at slice (M-1-i): last master on top
    const cy = topY + n*dz;
    const ly = cy + ry - dz/2;           // middle of the front band exposed below the disc above
    ctx.fillStyle = "rgba(0,0,0,0.55)";  // drop shadow for legibility on bright colours
    ctx.fillText(MASTERS[i].name, cx, ly+1);
    ctx.fillStyle = "#fff";
    ctx.fillText(MASTERS[i].name, cx, ly);
  }
}

function loop(){
  if (autospin && !dragging) rot += 0.004;
  render();
  requestAnimationFrame(loop);
}

cv.addEventListener("pointerdown", e=>{ dragging=true; lastX=e.clientX; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e=>{ if(dragging){ rot += (e.clientX-lastX)*0.01; lastX=e.clientX; }});
cv.addEventListener("pointerup",   ()=>{ dragging=false; });
document.getElementById("tilt").addEventListener("input", e=>{ tilt = +e.target.value/100; document.getElementById("tiltval").textContent = e.target.value; });
document.getElementById("slices").addEventListener("input", e=>{ perGap = +e.target.value; });
document.getElementById("spin").addEventListener("change", e=>{ autospin = e.target.checked; });
document.getElementById("hole").addEventListener("change", e=>{ holeOn = e.target.checked; });
loop();
</script>
</body>
</html>
